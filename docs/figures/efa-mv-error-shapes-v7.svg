  <g id="text_19">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start" x="28.98" y="35.436563" transform="rotate(-0 28.98 35.436563)">Large matrices can still have large probe error</text>
  </g>
  <g id="text_20">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="28.98" y="58.5" transform="rotate(-0 28.98 58.5)">128 probes · 256 seeds per operator · synthetic matrix constructions, not fitted survey datasets</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(28.98 438.9025)">RMS is a measure across random draws, not a per-run limit. The observed maximum is not a population bound.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(28.98 451.62)">Increasing dimension or trace magnitude does not repair a dominant dense direction; rank and orientation matter.</text>
  </g>
