name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - run: npx vitest run

      # The workflow used to stop at the line above, so a type error or a broken
      # build reached the preview deployment before it reached CI (finding E3).
      # These are the same three commands the review ran by hand every time.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

      # eslint carries a known backlog (mostly no-explicit-any in code that
      # predates the review), so failing on any problem would fail every run.
      # Gate on the count instead: it may fall, never rise. Lower BASELINE when
      # you clear some — that is the point of pinning it.
      - name: Lint (no regressions)
        run: |
          BASELINE=123
          COUNT=$(npx eslint . -f json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r.reduce((n,f)=>n+f.errorCount+f.warningCount,0))})")
          echo "eslint problems: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::eslint problems rose from $BASELINE to $COUNT"
            npx eslint . || true
            exit 1
          fi
