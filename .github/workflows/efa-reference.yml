name: Fresh independent R qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 1'

permissions:
  contents: read

concurrency:
  group: fresh-r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Pinned R 4.5.1, fresh small/public reference matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install the numerical workspace
        run: npm ci
        working-directory: .
      - name: Build the shared numerical package
        run: npm run build:stats
        working-directory: .
      - name: Install the workbench
        run: npm ci
      - name: Verify retained fixture integrity before fresh regeneration
        run: npm run ci:reference-integrity
      - name: Build pinned R runtime and regenerate into separate artifacts
        run: npm run ci:reference-r
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fresh-independent-r-reference
          path: frontend/.ci-artifacts/fresh-r/
          include-hidden-files: true
          retention-days: 30
